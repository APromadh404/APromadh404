name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *" # every 12 hours
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Grant write access for pushing to the output branch
    steps:
      - uses: actions/checkout@v4
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            github-contribution-grid-snake.svg
            github-contribution-grid-snake-dark.svg?palette=github-dark
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify output files
        run: |
          echo "Checking output files:"
          ls -l
          if [ ! -f github-contribution-grid-snake.svg ]; then
            echo "Error: github-contribution-grid-snake.svg not found"
            exit 1
          fi
          if [ ! -f github-contribution-grid-snake-dark.svg ]; then
            echo "Error: github-contribution-grid-snake-dark.svg not found"
            exit 1
          fi
      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: .
          keep_history: true # Create branch if it doesn't exist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
